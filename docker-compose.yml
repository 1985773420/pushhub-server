services:
  pushhub:
    build: .
    image: pushhub:latest
    container_name: pushhub
    restart: unless-stopped
    ports:
      - "${PORT:-8095}:8095"
    env_file:
      - .env
    environment:
      PORT: 8095
      HOST: 0.0.0.0
    volumes:
      - ./data:/app/data
      - ./public:/app/public:ro
      - ./releases:/app/releases:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8095/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
